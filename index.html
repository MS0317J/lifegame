<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>超簡単な人生ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎲 超簡単な人生ゲーム</h1>
  <p>あなたの人生、どうなる！？</p>
</header>

<section class="status">
  <div><span>💰 所持金</span><strong id="money">100,000円</strong></div>
  <div><span>😊 幸福度</span><strong id="happiness">50</strong></div>
  <div><span>💼 職業</span><strong id="job">未就職</strong></div>
  <div><span>🎂 年齢</span><strong id="age">18歳</strong></div>
  <div><span>📍 現在地</span><strong id="position">0</strong></div>
</section>

<section class="sound-controls">
  <button id="bgmButton">🎵 BGM OFF</button>
  <button id="seButton">🔊 SE ON</button>
</section>

<main class="game-area">
  <section class="board-section">
    <div id="dice" class="dice">🎲</div>
    <button id="rollButton" class="main-button">🎲 サイコロを振る</button>
    <div id="board" class="board"></div>
    <button id="restartButton" class="restart-button">🔄 最初からやり直す</button>
  </section>

  <section id="event-panel" class="event-panel">
    <div id="eventVisual" class="event-visual"><div id="visualMain">🧒</div></div>
    <div id="eventType" class="event-type">LIFE EVENT</div>
    <h2 id="eventTitle">人生スタート！</h2>
    <p id="eventText">キャラクターを選んで人生を始めよう！</p>
    <div class="changes">
      <div id="moneyChange"></div>
      <div id="happinessChange"></div>
      <div id="jobChange"></div>
    </div>
  </section>
</main>

<!-- キャラクター選択モーダル -->
<div id="characterModal" class="modal active">
  <div class="modal-content character-modal-content">
    <div class="modal-icon">🎭</div>
    <h2>キャラクターを選ぼう！</h2>
    <p>あなたの人生の主人公を選んでね。</p>

    <div class="character-options">
      <button class="character-option" data-character="boy">
        <span class="character-icon">👦</span>
        <span class="character-name">男の子</span>
      </button>
      <button class="character-option" data-character="girl">
        <span class="character-icon">👧</span>
        <span class="character-name">女の子</span>
      </button>
      <button class="character-option" data-character="neutral">
        <span class="character-icon">🧑</span>
        <span class="character-name">中性的</span>
      </button>
    </div>

    <button id="characterStartButton" class="main-button" disabled>🚀 このキャラクターで始める</button>
  </div>
</div>

<!-- 就職モーダル -->
<div id="jobModal" class="modal">
  <div class="modal-content">
    <div class="modal-icon">👔</div>
    <h2>就職の時間！</h2>
    <p>サイコロを振って<br>あなたの職業を決めよう！</p>
    <div id="jobDice" class="dice big-dice">🎲</div>
    <button id="jobRollButton" class="main-button">🎲 職業サイコロを振る</button>
    <div id="jobResult" class="job-result"></div>
  </div>
</div>

<!-- 分かれ道モーダル -->
<div id="branchModal" class="modal">
  <div class="modal-content">
    <div class="modal-icon">🛣️</div>
    <h2>人生の分かれ道</h2>
    <p>運命のサイコロを振ろう！</p>
    <div id="branchDice" class="dice big-dice">🎲</div>
    <button id="branchRollButton" class="main-button">🎲 運命を決める</button>
    <div id="branchResult" class="job-result"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
